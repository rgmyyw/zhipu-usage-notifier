version: "3.8"

services:
  zhipu-usage-notifier:
    build: .
    container_name: zhipu-usage
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config.json
      - DASHBOARD_PORT=8060
    ports:
      - "8060:8060"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
